# ============================================================
# FanchmWrt x86/64 固件编译（25.12.4-1.0.4 基线）
#   - daed（dae 透明代理）+ 其内核依赖（eBPF/BTF/XDP）全部编译进内核
#   - appfilter（Open App Filter / kmod-fwx / fwxd）内核依赖全部编译进内核
#   - FanchmWrt 全部默认插件（luci-app-fwx-*）全选
#   - 分区：efi/boot = 2G，rootfs = 2G，data = 5G（首次启动自动挂载 /data）
#
# 源码：fanchmwrt/fanchmwrt @ fanchmwrt-25.12.4（即 25.12.4-1.0.4 迭代）
# 触发：Actions → Build FanchmWrt x86/64 (daed + appfilter + partitions) → Run workflow
# ============================================================

name: Build FanchmWrt x86/64 (daed + appfilter + partitions)

on:
  workflow_dispatch:
    inputs:
      rootfs_mb:
        description: 'rootfs 分区大小 (MB)'
        required: false
        default: '2048'
      kernel_mb:
        description: 'efi/boot 分区大小 (MB)'
        required: false
        default: '2048'
      data_mb:
        description: 'data 数据分区大小 (MB)'
        required: false
        default: '5120'
  push:
    paths:
      - '.github/workflows/build-fanchmwrt.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout FanchmWrt source
        uses: actions/checkout@v4
        with:
          repository: fanchmwrt/fanchmwrt
          ref: fanchmwrt-25.12.4
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget bc cpio libelf-dev dwarves \
            gdisk sgdisk parted dosfstools e2fsprogs
          # dwarves 提供 pahole；开启 CONFIG_KERNEL_DEBUG_INFO_BTF 必需
          command -v pahole && pahole --version

      - name: Add daed feed (QiuSimons: 含 daed 守护进程 + luci-app-daed)
        run: |
          grep -q "luci-app-daed" feeds.conf.default || cat >> feeds.conf.default <<'EOF'

          # --- daed (dae 透明代理) ---
          src-git daed https://github.com/QiuSimons/luci-app-daed.git;master
          EOF
          tail -5 feeds.conf.default

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Kernel extra config (XDP sockets for daed)
        run: |
          # BTF 必须在顶层 .config 打开；这里只补 kmod-xdp-sockets-diag 需要的 XDP 符号
          grep -q "CONFIG_XDP_SOCKETS=y" target/linux/x86/64/config-6.12 || cat >> target/linux/x86/64/config-6.12 <<'EOF'

          # --- daed 依赖：XDP sockets ---
          CONFIG_XDP_SOCKETS=y
          EOF

      - name: Fetch official package list (all default plugins + appfilter kernels)
        run: |
          for i in 1 2 3; do
            curl -sSL --max-time 60 -o packages-official.txt \
              https://raw.githubusercontent.com/huakai569121/fanwrt-daede-build/main/packages-official.txt && break
            echo "retry $i ..."; sleep 5
          done
          echo "packages lines: $(wc -l < packages-official.txt)"
          head -3 packages-official.txt

      - name: Generate .config
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          # ---- 分区大小（MB）----
          CONFIG_TARGET_KERNEL_PARTSIZE=${{ github.event.inputs.kernel_mb }}
          CONFIG_TARGET_ROOTFS_PARTSIZE=${{ github.event.inputs.rootfs_mb }}

          # ---- BTF（dae CO-RE eBPF 必需）----
          # 必须关掉 REDUCED，否则 BTF 被静默丢弃
          CONFIG_KERNEL_DEBUG_INFO=y
          # CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set
          CONFIG_KERNEL_DEBUG_INFO_BTF=y

          # ---- daed/dae 内核依赖（强制 =y 编译进内核）----
          CONFIG_PACKAGE_kmod-sched-core=y
          CONFIG_PACKAGE_kmod-sched-bpf=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-xdp-sockets-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_ca-bundle=y

          # ---- daed 应用包（QiuSimons feed 提供 daemon + luci-app）----
          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_luci-app-daed=y
          CONFIG_PACKAGE_luci-i18n-daed-zh-cn=y

          # ---- appfilter（Open App Filter）内核依赖强制 =y ----
          CONFIG_PACKAGE_kmod-fwx=y
          CONFIG_PACKAGE_kmod-ipt-conntrack=y
          CONFIG_PACKAGE_kmod-ipt-conntrack-extra=y
          CONFIG_PACKAGE_luci-app-fwx-appfilter=y
          EOF

          # 追加官方 25.12.4-1.0.4 底包完整集合（含全部 luci-app-fwx-* 与 fwxd）
          cat packages-official.txt >> .config
          wc -l .config
          make defconfig

      - name: Verify critical options (fail fast)
        run: |
          df -h / | tail -1
          echo "=== 关键配置校验（必须都有 =y）==="
          for k in CONFIG_KERNEL_DEBUG_INFO_BTF CONFIG_TARGET_x86_64 \
                   CONFIG_TARGET_ROOTFS_PARTSIZE CONFIG_TARGET_KERNEL_PARTSIZE \
                   CONFIG_PACKAGE_kmod-sched-bpf CONFIG_PACKAGE_kmod-veth \
                   CONFIG_PACKAGE_kmod-xdp-sockets-diag CONFIG_PACKAGE_kmod-nft-tproxy \
                   CONFIG_PACKAGE_kmod-fwx CONFIG_PACKAGE_daed CONFIG_PACKAGE_luci-app-daed \
                   CONFIG_PACKAGE_luci-app-fwx-appfilter; do
            printf '%-46s %s\n' "$k" "$(grep -m1 "^${k}=" .config || echo '!!! 未选中')"
          done
          if ! grep -q "^CONFIG_KERNEL_DEBUG_INFO_BTF=y" .config; then
            echo "!! 未启用 CONFIG_KERNEL_DEBUG_INFO_BTF —— 终止"; exit 1
          fi
          if grep -q "^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y" .config; then
            echo "!! KERNEL_DEBUG_INFO_REDUCED 仍为 y，会否决 BTF —— 终止"; exit 1
          fi
          if ! grep -q "^CONFIG_PACKAGE_daed=y" .config; then
            echo "!! daed 未选中 —— 终止"; exit 1
          fi
          echo "== 配置 OK，继续编译 =="

      - name: Embed data-partition mount script (first boot -> /data)
        run: |
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-fanchmwrt-data <<'EOF'
          #!/bin/sh
          # FanchmWrt: 把 data 分区（LABEL=data）挂载到 /data，并在 fstab 持久化
          DEV=$(blkid -L data 2>/dev/null || true)
          [ -z "$DEV" ] && exit 0
          mkdir -p /data
          if ! uci -q get fstab.data >/dev/null 2>&1; then
            uci -q add fstab
            uci -q set fstab.@mount[-1].target='/data'
            uci -q set fstab.@mount[-1].device='LABEL=data'
            uci -q set fstab.@mount[-1].fstype='ext4'
            uci -q set fstab.@mount[-1].options='rw,noatime'
            uci -q set fstab.@mount[-1].enabled='1'
            uci -q set fstab.@mount[-1].enabled_fsck='1'
            uci -q commit fstab
          fi
          mount "$DEV" /data 2>/dev/null || true
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-fanchmwrt-data
          echo "--- embedded uci-defaults ---"; cat files/etc/uci-defaults/99-fanchmwrt-data

      - name: Download sources
        run: make -j$(nproc) download

      - name: Build
        run: make -j$(nproc) BUILD_LOG=1

      - name: Carve 5G data partition (efi 2G + rootfs 2G + data 5G)
        continue-on-error: true
        run: |
          set -x
          IMG=$(ls bin/targets/x86/64/*-ext4-combined-efi.img.gz 2>/dev/null | head -1)
          if [ -z "$IMG" ]; then
            echo "未找到 ext4-combined-efi 镜像，跳过 data 分区（基础镜像仍会上传）"
            exit 0
          fi
          # 释放构建目录，给数据分区腾出磁盘
          rm -rf build_dir staging_dir || true
          gunzip -kf "$IMG"
          RAW="${IMG%.gz}"
          # 文件尾部追加 data 分区空间
          truncate -s +${{ github.event.inputs.data_mb }}M "$RAW"
          sfdisk -d "$RAW"
          # 在空闲区域新增第 3 分区（data）
          echo ", +${{ github.event.inputs.data_mb }}M, L" | sfdisk -N 3 "$RAW"
          LOOP=$(sudo losetup -fP --show "$RAW")
          sleep 2
          sudo mkfs.ext4 -F -L data "${LOOP}p3"
          sudo losetup -d "$LOOP"
          gzip -f "$RAW"
          echo "=== 最终镜像分区 ==="
          fdisk -l "$RAW" 2>/dev/null || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-25.12.4-x86-64-daed-appfilter
          path: bin/targets/x86/64/*.img.gz
          if-no-files-found: warn
          retention-days: 30

      - name: Upload .config (便于复现)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-config
          path: .config
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          retention-days: 7
