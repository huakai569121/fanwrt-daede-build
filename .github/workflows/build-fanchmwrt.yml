# ============================================================
# FanchmWrt x86/64 固件编译（25.12.4-1.0.4 基线）——「仅内核」版本
#   - 只编译【内核】，不把插件（daed / appfilter / fanchmwrt 默认 luci-app）编进固件；
#     方便刷机后自己 opkg install 任意插件，无需重编内核。
#   - daed 依赖内核：eBPF/BTF + sched-bpf + veth + nft-tproxy/socket/compat + xdp-sockets（CONFIG_XDP_SOCKETS）
#   - appfilter 依赖内核：kmod-fwx + kmod-ipt-conntrack(+extra) + kmod-ipt-filter
#   - fanchmwrt 插件内核：packages-official.txt 中全部 274 个 kmod-* 直接编译进内核
#   - 分区：efi/boot = 2G，rootfs = 2G，data = 5G（首次启动自动挂载 /data）
#
# 源码：fanchmwrt/fanchmwrt @ fanchmwrt-25.12.4（即 25.12.4-1.0.4 迭代）
# 触发：Actions → Build FanchmWrt x86/64 (kernel-only + partitions) → Run workflow
# 说明：本工作流不添加任何外部插件 feed（避免用户态包缺失导致 defconfig 剔除），
#       仅通过内核选项与 kmod 把依赖固化进内核。
# ============================================================

name: Build FanchmWrt x86/64 (kernel-only + partitions)

on:
  workflow_dispatch:
    inputs:
      rootfs_mb:
        description: 'rootfs 分区大小 (MB)'
        required: false
        default: '2048'
      kernel_mb:
        description: 'efi/boot 分区大小 (MB)'
        required: false
        default: '2048'
      data_mb:
        description: 'data 数据分区大小 (MB)'
        required: false
        default: '5120'
  push:
    paths:
      - '.github/workflows/build-fanchmwrt.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout FanchmWrt source
        uses: actions/checkout@v4
        with:
          repository: fanchmwrt/fanchmwrt
          ref: fanchmwrt-25.12.4
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget bc cpio libelf-dev dwarves \
            gdisk parted dosfstools e2fsprogs
          # dwarves 提供 pahole；开启 CONFIG_KERNEL_DEBUG_INFO_BTF 必需
          command -v pahole && pahole --version

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Kernel extra config (XDP sockets for daed)
        run: |
          # BTF 必须用顶层 .config 打开；XDP sockets 是 kmod-xdp-sockets-diag 的内核依赖，
          # 手写进 target/linux/x86/64/config-6.12 才能保住（Kconfig 不会因依赖丢弃）。
          grep -q "CONFIG_XDP_SOCKETS=y" target/linux/x86/64/config-6.12 || cat >> target/linux/x86/64/config-6.12 <<'EOF'

          # --- daed 依赖：XDP sockets ---
          CONFIG_XDP_SOCKETS=y
          EOF

      - name: Fetch official package list (for kmod-* only)
        run: |
          for i in 1 2 3; do
            curl -sSL --max-time 60 -o packages-official.txt \
              https://raw.githubusercontent.com/huakai569121/fanwrt-daede-build/main/packages-official.txt && break
            echo "retry $i ..."; sleep 5
          done
          echo "packages lines: $(wc -l < packages-official.txt)"
          echo "kmod-* lines: $(grep -c '^CONFIG_PACKAGE_kmod-' packages-official.txt)"

      - name: Generate .config (kernel-only)
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          # ---- 分区大小（MB）。加 || 兜底：push 触发时 inputs 为空，回退到默认 2048 ----
          CONFIG_TARGET_KERNEL_PARTSIZE=${{ github.event.inputs.kernel_mb || '2048' }}
          CONFIG_TARGET_ROOTFS_PARTSIZE=${{ github.event.inputs.rootfs_mb || '2048' }}

          # ---- BTF（dae CO-RE eBPF 必需，后续 opkg 安装 daed 即可运行）----
          # 必须关掉 REDUCED，否则 BTF 被静默丢弃
          CONFIG_KERNEL_DEBUG_INFO=y
          # CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set
          CONFIG_KERNEL_DEBUG_INFO_BTF=y

          # ---- daed/dae 内核依赖（kmod 编译进内核）----
          CONFIG_PACKAGE_kmod-sched-core=y
          CONFIG_PACKAGE_kmod-sched-bpf=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_kmod-xdp-sockets-diag=y

          # ---- appfilter（Open App Filter）内核依赖编译进内核 ----
          CONFIG_PACKAGE_kmod-fwx=y
          CONFIG_PACKAGE_kmod-ipt-conntrack=y
          CONFIG_PACKAGE_kmod-ipt-conntrack-extra=y
          CONFIG_PACKAGE_kmod-ipt-filter=y

          # ---- 基础 web 管理界面（base luci，非插件，便于刷机后管理）----
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          EOF

          # 追加 fanchmwrt 默认插件的全部 kmod-* 内核模块（供后续 opkg 安装插件）。
          # 只包含内核模块，不编任何用户态插件包。
          grep '^CONFIG_PACKAGE_kmod-' packages-official.txt >> .config

          wc -l .config
          make defconfig

      - name: Verify critical kernel options (fail fast)
        run: |
          df -h / | tail -1
          echo "=== 关键内核配置校验 ==="
          for k in CONFIG_KERNEL_DEBUG_INFO_BTF CONFIG_TARGET_x86_64 \
                   CONFIG_TARGET_ROOTFS_PARTSIZE CONFIG_TARGET_KERNEL_PARTSIZE \
                   CONFIG_PACKAGE_kmod-sched-bpf CONFIG_PACKAGE_kmod-veth \
                   CONFIG_PACKAGE_kmod-xdp-sockets-diag CONFIG_PACKAGE_kmod-fwx \
                   CONFIG_PACKAGE_kmod-ipt-conntrack CONFIG_PACKAGE_kmod-nft-tproxy; do
            v=$(grep -m1 "^${k}=" .config || true)
            if [ -z "$v" ]; then echo "  [warn] $k 未选中（依赖未满足，将被 opkg 按需安装）"; else echo "  $k = ${v#*=}"; fi
          done
          # 确认 fanchmwrt 默认插件内核模块已编入（计数）
          echo "kmod-* 已编入数量: $(grep -c '^CONFIG_PACKAGE_kmod-.*=y' .config)"
          if ! grep -q "^CONFIG_KERNEL_DEBUG_INFO_BTF=y" .config; then
            echo "!! 未启用 CONFIG_KERNEL_DEBUG_INFO_BTF —— 终止"; exit 1
          fi
          if grep -q "^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y" .config; then
            echo "!! KERNEL_DEBUG_INFO_REDUCED 仍为 y，会否决 BTF —— 终止"; exit 1
          fi
          echo "== 内核配置 OK，继续编译 =="

      - name: Embed data-partition mount script (first boot -> /data)
        run: |
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-fanchmwrt-data <<'EOF'
          #!/bin/sh
          # FanchmWrt: 把 data 分区（LABEL=data）挂载到 /data，并在 fstab 持久化
          DEV=$(blkid -L data 2>/dev/null || true)
          [ -z "$DEV" ] && exit 0
          mkdir -p /data
          if ! uci -q get fstab.data >/dev/null 2>&1; then
            uci -q add fstab
            uci -q set fstab.@mount[-1].target='/data'
            uci -q set fstab.@mount[-1].device='LABEL=data'
            uci -q set fstab.@mount[-1].fstype='ext4'
            uci -q set fstab.@mount[-1].options='rw,noatime'
            uci -q set fstab.@mount[-1].enabled='1'
            uci -q set fstab.@mount[-1].enabled_fsck='1'
            uci -q commit fstab
          fi
          mount "$DEV" /data 2>/dev/null || true
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-fanchmwrt-data
          echo "--- embedded uci-defaults ---"; cat files/etc/uci-defaults/99-fanchmwrt-data

      - name: Download sources
        run: make -j$(nproc) download

      - name: Build
        run: make -j$(nproc) BUILD_LOG=1

      - name: Carve 5G data partition (efi 2G + rootfs 2G + data 5G)
        continue-on-error: true
        run: |
          set -x
          IMG=$(ls bin/targets/x86/64/*combined-efi*.img.gz 2>/dev/null | head -1)
          if [ -z "$IMG" ]; then
            echo "未找到 combined-efi 镜像，跳过 data 分区（基础镜像仍会上传）"
            exit 0
          fi
          # 释放构建目录，给数据分区腾出磁盘
          rm -rf build_dir staging_dir || true
          gunzip -kf "$IMG"
          RAW="${IMG%.gz}"
          # 文件尾部追加 data 分区空间（加 || 兜底，避免 push 触发时为空）
          truncate -s +${{ github.event.inputs.data_mb || '5120' }}M "$RAW"
          sfdisk -d "$RAW"
          # 在空闲区域新增第 3 分区（data）
          echo ", +${{ github.event.inputs.data_mb || '5120' }}M, L" | sfdisk -N 3 "$RAW"
          LOOP=$(sudo losetup -fP --show "$RAW")
          sleep 2
          sudo mkfs.ext4 -F -L data "${LOOP}p3"
          sudo losetup -d "$LOOP"
          gzip -f "$RAW"
          echo "=== 最终镜像分区 ==="
          fdisk -l "$RAW" 2>/dev/null || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-25.12.4-x86-64-kernel-only
          path: bin/targets/x86/64/*.img.gz
          if-no-files-found: warn
          retention-days: 30

      - name: Upload .config (便于复现)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-config
          path: .config
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          retention-days: 7
